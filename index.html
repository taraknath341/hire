<!DOCTYPE html>
<html>

<head>
	<link rel="shortcut icon" href="https://taraknath341.github.io/svg/logo.svg" type="image/x-icon">
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<link rel="stylesheet" type="text/css" href="style.css">
	<title>Hire Me | Tarak Program</title>
</head>

<body>
	<center>
		<span style="color: transparent;">*</span>
		<div id="form">
			<h1>Hire Me | Tarak Program</h1>
			<button class="input-placeholder">
				Enter Name
				<br>
				<input type="text" class="input">
			</button>

			<button class="input-placeholder">
				Enter Email
				<br>
				<input type="email" class="input">
			</button>

			<button class="input-placeholder">
				Enter Referral Code
				<br>
				<input type="text" class="input" placeholder="get 15% discount">
			</button>

			<button class="input-placeholder">
				Enter Mobile No
				<br>
				<input type="text" class="input">
			</button>

			<button class="input-placeholder">
				Why would you hire me?
				<br>
				<select class="input">
					<option value="" selected>Plese Select</option>
					<option value="frontend">Frontend Development</option>
					<option value="backend">Backend Development</option>
					<option value="fullstack">FullStack Development</option>
					<option value="seo">Search Engine Optimization</option>
				</select>
			</button>
			<br>
			<button class="input-placeholder" id="textarea-placeholder">
				What kind of website do you want to build? What will the website do?
				<br>
				<textarea class="input" cols="22" rows="3"></textarea>
			</button>
			<br>
			<button class="btn" onclick="clearValue()">Reset</button>
			<button class="btn" onclick="formSubmit()">Submit</button>
		</div>
		<div id="output">
			<img src="" width="100%">
		</div>
	</center>
	<script src="script.js"></script>
</body>

</html>
